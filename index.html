 else if(a==="rm"){sync();const i=[...document.querySelectorAll(".prow")].indexOf(b.closest(".prow"));e.parts.splice(i,1);render()}
 else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="tehkarty.json";l.click()}
 else if(a==="reset"){if(confirm("Все изменения будут потеряны. Сбросить?"))guard(DB.replace(seed()),()=>{e=null;render()})}
});
document.addEventListener("change",ev=>{
 if(ev.target.id==="f_img"&&ev.target.files[0]){sync();compress(ev.target.files[0],u=>{e.img=u;render()})}
 if(ev.target.id==="imp"&&ev.target.files[0]){const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.rolls||!n.sets)throw 0;DB.replace(n).then(()=>{e=null;render()})}catch(x){alert("Файл не подходит")}};r.readAsText(ev.target.files[0])}
});
DB.sub(()=>{if(!e)render()});render();
})()}else{(function(){
const d=DB.d,app=document.getElementById("app"),root=document.documentElement;
const R=id=>d.rolls.find(x=>x.id===id);
let st={view:"home",f:null,q:"",type:"all",item:null};
function theme(t){const m={bg:"--bg",surface:"--surface",text:"--text",muted:"--muted",line:"--line",accent:"--accent",at:"--accent-text"};
 for(const k in m){t?root.style.setProperty(m[k],t[k]):root.style.removeProperty(m[k])}}
function go(v,p={}){st={...st,view:v,...p};window.scrollTo(0,0);render()}
function render(){theme(st.f&&st.view!=="home"?FR.find(x=>x.id===st.f).t:null);st.view==="home"?home():st.view==="menu"?menu():card()}
function home(){
 app.innerHTML=`<div class="home"><h1>Тех-карты роллов</h1><p class="sub">Выберите доставку</p><div class="brands">${FR.map(f=>`<button class="brand" data-f="${f.id}">${esc(f.name)}</button>`).join("")}</div><p class="sub" style="margin-top:28px"><a href="#admin" style="color:inherit">Админ-панель</a></p></div>`;
 app.querySelectorAll(".brand").forEach(b=>b.onclick=()=>go("menu",{f:b.dataset.f,q:"",type:"all"}));
}
function weight(s){return s.parts.reduce((a,p)=>a+(R(p[0])?R(p[0]).w*p[1]/8:0),0)|0}
function menu(){
 const fr=FR.find(x=>x.id===st.f);
 app.innerHTML=`<button class="back" id="back">← Все доставки</button><div class="center"><h1>${esc(fr.name)}</h1></div>
 <input class="search" id="q" type="search" placeholder="Поиск ролла или сета" value="${esc(st.q)}" autocomplete="off">
 <div class="tabs">${[["all","Всё"],["roll","Роллы"],["set","Сеты"]].map(([k,l])=>`<button class="tab ${st.type===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div><ul class="list" id="list"></ul>`;
 document.getElementById("back").onclick=()=>go("home",{f:null});
 const q=document.getElementById("q");q.oninput=()=>{st.q=q.value;fill()};
 app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{st.type=t.dataset.t;menu()});fill();
}
function fill(){
 const q=st.q.trim().toLowerCase();
 const all=d.sets.filter(x=>x.f===st.f).map(x=>({k:"set",id:x.id,name:x.name,w:weight(x)})).concat(d.rolls.filter(x=>x.f===st.f).map(x=>({k:"roll",id:x.id,name:x.name,w:x.w})));
 const rows=all.filter(i=>(st.type==="all"||i.k===st.type)&&(!q||i.name.toLowerCase().includes(q)));
 const ul=document.getElementById("list");
 ul.innerHTML=rows.length?rows.map((i,n)=>`<li class="item go" tabindex="0" data-n="${n}"><b>${esc(i.name)}</b><small>${i.k==="set"?"сет":"ролл"} · ${i.w} г</small></li>`).join(""):`<li class="empty">${DB.loaded?"Ничего не найдено. Попробуйте другое название.":"Загрузка…"}</li>`;
 ul.querySelectorAll(".item").forEach(li=>{const o=()=>go("card",{item:rows[+li.dataset.n]});li.onclick=o;li.onkeydown=e=>{if(e.key==="Enter")o()}});
}
const photo=o=>o.img?`<img class="photo" src="${o.img}" alt="">`:`<div class="photo ph">Нет фото</div>`;
const steps=a=>`<ol class="steps">${a.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
function card(){
 const it=st.item;let h=`<button class="back" id="back">← Назад к списку</button>`;
 if(it.k==="roll"){const r=R(it.id);if(!r){go("menu");return}
  h+=`${photo(r)}<div class="center"><h1>${esc(r.name)}</h1><div class="meta"><span class="chip">Ролл</span><span class="chip">Выход: ${r.w} г</span></div></div>
  <h2>Состав</h2><div class="wrap"><table><tr><th>Ингредиент</th><th>Количество</th></tr>${r.ingr.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table></div><h2>Приготовление</h2>${steps(r.steps)}`;
 }else{const s=d.sets.find(x=>x.id===it.id);if(!s){go("menu");return}const ps=s.parts.filter(p=>R(p[0]));
  h+=`${photo(s)}<div class="center"><h1>${esc(s.name)}</h1><div class="meta"><span class="chip">Сет</span><span class="chip">Выход: ~${weight(s)} г</span></div></div>
  <h2>Состав сета</h2><p class="base">${esc(BASE)}</p><ol class="comp">${ps.map(p=>`<li><b>${esc(R(p[0]).name)}</b> — ${p[1]} шт.<br><span>${esc(R(p[0]).ingr.slice(2).map(x=>x[0].toLowerCase()).join(", "))}</span></li>`).join("")}</ol>
  <h2>Роллеры и выдача</h2><div class="cols"><h2>Роллеры: внутри и снаружи</h2><h2>Выдача: шапочка и полив</h2>${ps.map((p,n)=>{const r=R(p[0]);return `<div class="c"><b>${n+1}. ${esc(r.name)}</b><br><span>Внутри: ${esc(r.in)}<br>Снаружи: ${esc(r.out)}</span></div><div class="c"><b>${n+1}. ${esc(r.name)}</b><br><span>${esc(r.top)}</span></div>`}).join("")}</div>
  <h2>Сборщикам</h2><ul class="pk">${(s.pack||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
 }
 app.innerHTML=h;document.getElementById("back").onclick=()=>go("menu");
}
DB.sub(()=>{if(st.view==="menu")fill();else if(st.view==="card")render()});render();
})()}</script></body></html>
